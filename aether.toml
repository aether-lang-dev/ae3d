# ae3d as the Aether toolchain sees it: `ae build examples/physics.ae` and
# `ae run examples/physics.ae` from the repository root, with nothing else to
# set up once the toolchain, GLFW and the Vulkan headers are installed.
#
# What a program needs comes from the modules it imports, not from here: the
# engine's C files with @source (the crash handler in ae3d.core, the DLSS stub
# and macOS's Metal layer in ae3d.vkdevice) and its libraries with @link, per
# platform (GLFW and the system's windowing and GL in ae3d.platform). ae3d.*
# resolves out of src/ by the compiler's own rule.
#
# build.sh remains for what this cannot say: the engine as one shared library
# that a program and the scripts it loads both link, and the DLSS shim built
# against the Streamline SDK.

[package]
name = "ae3d"
description = "A 3D engine in Aether"
# What a project that depends on ae3d can import: the ae3d package under
# src/, so ae3d.* resolves from the consumer as it does here (#524). The
# entry names the package's directory, and what joins the consumer's search
# path is its parent, src/.
modules = "src/ae3d"

# The physics engine, from the submodule under deps/ (git submodule update
# --init). It exports its root, so aephysics.* imports with no --lib.
[dependencies]
"github.com/aether-lang-dev/aephysics" = "0.1.0"

[patch]
"github.com/aether-lang-dev/aephysics" = "deps/aephysics"

[build]
# Every multiply and add rounded on its own, as build.sh compiles everything
# (ae3d_fp_flags): the networked horde and aephysics are held to the bit on
# every peer, and a fused multiply-add rounds once where the pair rounds
# twice (#441).
cflags = "-ffp-contract=off"
