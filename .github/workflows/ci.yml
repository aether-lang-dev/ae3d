name: ci

# Runs for every pull request against main, and by hand from the Actions tab.
# Not on every push: `./ci.sh` runs on the machine the change was written on
# before a pull request is opened, and the runners' three platforms are for
# what that machine cannot show. A pull request is the unit of review, so its
# checks are on the pull request, where the merge is decided; nothing is
# started by hand for a branch that has one.
#
# A change to prose alone starts nothing: the runners compile and run code,
# and a README edit gives them nothing to say. docs/agent.md is the one page
# checked against the code (ci.sh regenerates it), so it still runs them.
#
# And on main, when this file changes there. A pull request's run reads the
# caches its own branch saved and main's, never another pull request's, and
# nothing ran on main: every pull request's first run built the toolchain
# from source (a minute on Linux and macOS, three on Windows) and compiled
# with an empty ccache. A bump of AETHER_REF lands through this file, so the
# run it starts on main is the one that saves the toolchain every later pull
# request restores.
on:
  pull_request:
    branches: [main]
    paths:
      - '**'
      - '!**/*.md'
      - '!changes/**'
      - 'docs/agent.md'
  push:
    branches: [main]
    paths:
      - '.github/workflows/ci.yml'
  workflow_dispatch:

# A push to a pull request makes the run under way for the one before it
# worth nothing: it is cancelled rather than finished and paid for (#511).
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  # The Aether toolchain, by release. It was aether's HEAD, which moves
  # several times a day, so the toolchain cache missed on most runs and
  # every runner built the compiler from source first (1 to 2.5 minutes
  # each). Bumped by hand, with a line here saying why.
  #   v0.748.0 2026-09-30  first pin (#511); 0.743's slices are what the
  #                        engine is written against.
  #   v0.759.0 2026-10-03  0.757 took the binary calls' lengths into their
  #                        slices (aether#2342): fs.write_binary, tcp.write_n,
  #                        udp.send_to_addr, udp.recv_from_into (#551).
  #   v0.768.0 2026-10-03  std.truetype (aether#2365, #2367): ae3d.glyphs
  #                        reads fonts through it (#570).
  #   v0.778.0 2026-10-05  the Aether family's shared floor; no source change.
  #                        The macOS leg (suites, leaks) is green on it.
  #   v0.788.0 2026-10-07  std.lanes' f32x8 (aether#2428): aephysics a5d9940's
  #                        eight-lane contact solver is written on it.
  #   v0.791.0 2026-10-08  the latest release (0.789.0 was tagged, not
  #                        released; 0.791 adds the ESP32 build); kept at
  #                        Aether's latest before a merge.
  #   v0.793.0 2026-10-08  not taken, nor v0.794.0 or v0.795.0 (2026-10-09,
  #                        which have the same): 0.792's string ownership binds a
  #                        struct holding a string parameter as a string
  #                        (aether#2584, tools/generate_shaders.ae), leaves
  #                        an unused value clang warns on (aether#2585), and
  #                        the suites leak on macOS (aether#2586).
  #   v0.796.0 2026-10-09  not taken: it fixes aether#2584 and #2585, and the
  #                        motion gate and the editor build on it (#713), but
  #                        the macOS leak check still fails (aether#2586:
  #                        test_components, test_scene_io, test_audio,
  #                        test_worldsound; the audio ones were ae3d's, fixed
  #                        in #713).
  #   v0.797.0 2026-10-09  not taken: it does not carry the fix for
  #                        aether#2586's string results through function
  #                        pointers, and test_components still leaks.
  #   v0.798.0 2026-10-09  not taken: a sandbox fix only; aether#2586 is
  #                        still open.
  #   v0.799.0 2026-10-09  not taken: it carries aether#2586's fix, but the
  #                        mark it keeps is a thread-local the generated C
  #                        reads, which a program cannot import from the
  #                        runtime's DLL on Windows: 28 of the 33 motion
  #                        suites stop linking there (aether#2687). ae3d's
  #                        own part (std.string in ae3d.voxel, #730) is in.
  #   v0.805.0 2026-10-11  the latest release: aether#2586's fix without the
  #                        thread-local (aether#2687, fixed in 0.800.0), and
  #                        0.801's missing-return error, which nothing in
  #                        ae3d trips. The 33 motion suites build and pass on
  #                        it on Windows, the runtime a DLL.
  #   v0.809.0 2026-10-12  the first release since 0.806.0 (0.807 and 0.808
  #                        were tagged, never published); vec2/vec3/vec4 as
  #                        distinct types over f32x4 (aether#2778).
  #   v0.810.0 2026-10-13  `quote` (aether#2819): ae3d.gpu reads a shader
  #                        from the tree a quote hands it, and FXAA is
  #                        written that way (ae3d.shaders.fxaa).
  #   v0.811.0 2026-10-13  the batch of aether#2859 (57 fixes): new errors
  #                        for a slice of a function's own storage leaving it
  #                        (E0900) and a return checked against its type;
  #                        every test, example and tool builds clean on it,
  #                        and the motion gate passes.
  #   v0.812.0 2026-10-13  Valgrind's fair scheduling in Aether's own CI
  #                        (aether#2881); nothing in the compiler ae3d sees.
  #                        Every program builds clean and the motion gate
  #                        passes on it.
  #   v0.814.0 2026-10-14  sandbox.enforce no longer left on after its
  #                        block; nothing ae3d calls. Every program builds
  #                        clean on it and the motion gate passes.
  #   v0.816.0 2026-10-15  quote version 2 (aether#2927): @quotable
  #                        functions, the helpers a quoted shader calls,
  #                        which ae3d.gpu writes as GLSL functions (FXAA's
  #                        luma, the bloom's tap and group). Every quote's
  #                        hash changes with it, so the quoted shaders'
  #                        SPIR-V is regenerated and generate_shaders --check
  #                        holds to it. It brings 0.815.0's fix too: the
  #                        scheduler's locks destroyed when it stops, which
  #                        leaked on Windows.
  #   v0.817.0 2026-10-15  taken over 0.816.0: an untyped const array whose
  #                        first element is not a bare literal (`[-1, 2]`)
  #                        was an array of pointers (aether#2929), which
  #                        Apple's clang refuses; ae3d.gpu's call table met
  #                        it and is typed (`const CALL_ARGS: int[]`), and no
  #                        other ae3d array has that shape.
  #   v0.818.0 2026-10-16  the ownership rework (aether#2916, #2920..#2926):
  #                        a function that keeps a `ptr` parameter declares
  #                        it `@keep` (E0902), 370 across the engine, the
  #                        editor and the tools, and aephysics 51c67d7 for
  #                        its own; a function no longer frees a string it
  #                        was passed (E0901), so core.set_owned and its
  #                        copies are gone: a store into a string field
  #                        releases what it held; a string stored into C
  #                        memory viewed as `string[]` (vkdevice's extension
  #                        names) is a local first. Every program builds
  #                        with no warnings, the macOS leak check is clean.
  #   v0.821.0 2026-10-17  quote names uint32/uint16/uint8 in its trees and
  #                        types a fitting literal beside a uint32 as one
  #                        (aether#2947), so the sky filter's
  #                        radical_inverse is the hand-written one's 32-bit
  #                        reversal and the quoted filter is drawn; a
  #                        @quotable helper's tree name is its module's full
  #                        path (aether#2943, ae3d_shaders_bloom_tap), so
  #                        every quote with helpers hashes anew once and
  #                        its SPIR-V is regenerated. 0.819's --emit=lib
  #                        string handles touch nothing here: ae3d builds
  #                        and loads no --emit=lib library. aether#2948's
  #                        module-scoped externs and #2945 are in the next
  #                        release, not this one.
  #   v0.822.0 2026-10-17  an extern is the module's that declares it
  #                        (aether#2948): a program importing ae3d.vkspirv
  #                        no longer takes its memcpy for every module's, so
  #                        test_quoted_hashes imports it; a string built in a
  #                        `return` and passed to a call is no longer leaked
  #                        (#2946), so net's and nethandover's bound-first
  #                        returns are inline again; an inferred string
  #                        return is no longer freed before it is returned
  #                        (#2945).
  #   v0.823.0 2026-10-17  a string field read in a loop as an argument
  #                        beside a call is released once a pass, not
  #                        twice (found in ae3d.gpu's evaluator copying a
  #                        struct value field by field), so val_copy copies
  #                        its fields in the loop again and copy_field is
  #                        gone; on 0.822.0 that loop fails test_gpu_structs
  #                        and test_gpu_skydome, on 0.823.0 both pass.
  #   v0.824.0 2026-10-17  tracking: the family moves to it together (Paul).
  #                        A struct's, message's or actor's generated
  #                        helpers are in the _aether_ namespace and a
  #                        function may not be named spawn_<Actor> (#2804);
  #                        E0900 sees slices dangling through a closure
  #                        (#2846). No ae3d function collides with those
  #                        names, none is refused, and no quote's hash moves.
  #   v0.829.0 2026-10-18  a quote names an array of a distinct type by its
  #                        element (aether#2972): a captured struct's
  #                        vec4[4] field is vec4[4], not UNKNOWN[4], which
  #                        the composite's haze as one captured struct is
  #                        written on. A string given to a byte[] or other
  #                        slice parameter is E0200 (#2971): no ae3d call
  #                        does that, and every program, test, tool and
  #                        script type-checks unchanged. A literal reaching
  #                        a `ptr` return or parameter is its characters
  #                        (#2967 and its sibling); the unused-static,
  #                        -local and -helper fixes (0.825..0.829) and the
  #                        four ownership fixes (exit's argument, the
  #                        binary getters, a builder's defer, a glob's
  #                        `free`) leave ae3d no workaround to drop. No
  #                        quote's hash moves.
  AETHER_REF: v0.829.0
  # The aether-ui the editor is built against on the Linux runner. A commit,
  # not a branch: the editor's CI should say what the editor did, not what
  # the toolkit did that morning. Bumped by hand when aether-ui lands
  # something the editor needs; each bump gets a line here saying why.
  #   ef9be50 2026-09-18  win32 textfield_get_text hands back a heap string
  #                       (aether-ui#156); the ground/scrollview and layout
  #                       work of #149..#155 before it. First pin.
  #   c6c2842 2026-09-18  gtk4 honours AETHER_UI_TEST_PORT (aether-ui#161), so
  #                       the driver finds the editor on Linux.
  #   6ca82c2 2026-09-18  gtk4's driver hop runs at default priority
  #                       (aether-ui#162): an app drawing at 4 fps on llvmpipe
  #                       starved the idle-priority hop and /widgets never
  #                       answered.
  #   11a6916 2026-09-21  style_flat (aether-ui#176): the hierarchy's
  #                       disclosure is a frameless button; the win32 canvas,
  #                       paragraph and anchor fixes of #187 before it.
  #   7216a3d 2026-09-23  links against Aether 0.708+ (aether-ui#198): 0.708
  #                       made floatarr_get_unchecked inline-only and the
  #                       gtk4 backend's gradient stops called the export,
  #                       so the editor stopped linking on this runner.
  #   96f41d6 2026-09-30  real mouse input on win32 (aether-ui#217): clicks
  #                       on rows, rounded buttons and labels, values to
  #                       toggle/slider/picker closures, the wheel to what
  #                       is under the pointer, scroll views that fit, and
  #                       62 fps timers.
  #   dcc1bd4 2026-10-17  Aether 0.818.0 (aether-ui's own @keep on every ptr
  #                       parameter it keeps): 96f41d6 does not build on
  #                       0.818.0 (25 E0902). The editor builds on it with
  #                       no warnings, on macOS and on x86_64 Linux.
  AETHER_UI_REF: dcc1bd48

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          # Each runner runs the tier its platform is there for (ci.sh's
          # AE3D_CI_TIER, #511); the whole gate, the showcase scenes with
          # it, is ./ci.sh on the machine the change was written on.
          #
          # Linux's share is two runners at once. On one it was the run's
          # critical path, 38 minutes against macOS's 15 and Windows' 12
          # (run 36791964736): the suites, about 19 minutes, then the
          # examples and the editor, about 17. Each half has the packages it
          # uses and nothing else; GTK is only the editor's, the validation
          # layer only the suites'.
          #
          # And each tier is split over runners at once (`shard`, ci.sh's
          # AE3D_CI_SHARD, #710): almost all of a runner's minutes are
          # compiling, so a share of the programs a runner is a share of the
          # time. Unsplit, a full rebuild ran the suites' runner 31 to 36
          # minutes (166 programs in 1438 s, run of e8de382) and the whole run
          # waited on it; in four, each builds about 45. The first shard of a
          # tier keeps the tier's name, runs the steps that run once, and
          # writes the determinism trail (`trail`).
          - os: ubuntu-latest
            name: linux
            tier: suites
            shard: 0/4
            trail: true
            gpu: 1
            packages: vulkan-validationlayers
          - os: ubuntu-latest
            name: linux-2
            tier: suites
            shard: 1/4
            gpu: 1
            packages: vulkan-validationlayers
          - os: ubuntu-latest
            name: linux-3
            tier: suites
            shard: 2/4
            gpu: 1
            packages: vulkan-validationlayers
          - os: ubuntu-latest
            name: linux-4
            tier: suites
            shard: 3/4
            gpu: 1
            packages: vulkan-validationlayers
          # The examples on one, the editor on the other.
          - os: ubuntu-latest
            name: linux-apps
            tier: apps
            shard: 0/2
            gpu: 1
            packages: libgtk-4-dev libepoxy-dev
          - os: ubuntu-latest
            name: linux-editor
            tier: apps
            shard: 1/2
            gpu: 1
            packages: libgtk-4-dev libepoxy-dev
          - os: macos-latest
            name: macos
            tier: leaks
            shard: 0/2
            trail: true
            gpu: 0
          - os: macos-latest
            name: macos-2
            tier: leaks
            shard: 1/2
            gpu: 0
          # Windows had no arm here, and every Windows-only assumption in the
          # tree survived because of it: <dlfcn.h> included unconditionally, a
          # zlib we call but never link, an ICD array unused under -Werror, and
          # a constant named SIZE colliding with the typedef in windef.h. All
          # four were found by hand on a developer's machine (#103); a runner
          # would have caught them the day they landed.
          #
          # UCRT64, not MINGW64: the Aether installer's toolchain links the
          # Universal CRT, and a UCRT libaether.a will not link against msvcrt
          # gcc -- it fails on __imp__get_timezone and __imp__strtof_l, which
          # look like ae3d's problem and are not.
          - os: windows-latest
            name: windows
            tier: platform
            shard: 0/1
            trail: true
            gpu: 0
    runs-on: ${{ matrix.os }}
    name: ${{ matrix.name }}
    # Without this a hang holds the runner for six hours before GitHub takes it
    # back, which is what the Linux leg did with nothing in the log to say
    # where it stopped. The longest job is 16 minutes (linux-apps, run
    # 36919172954); a runner 27% slower across every step, as #514 met on
    # 2026-09-30, makes it about 20. 30 holds that runner with room and stops
    # a hang in half an hour; at 60 one held a runner an hour longer than the
    # whole run takes. 40 since 2026-10-09 (#710): on a full rebuild, after a
    # pin moves, the Linux leg builds 165 programs in 1025 to 1302 s and runs
    # 27 to 32 minutes; one on a slow runner was cut off at 30 in its tests.
    # 25 since the tiers were split over runners (#710): a shard builds a
    # quarter to a half of what a runner built, about 13 minutes on a full
    # rebuild on a slow runner, and a hang stops in under half an hour.
    timeout-minutes: 25

    defaults:
      run:
        # MSYS2 on Windows, the platform's own shell elsewhere. build.sh reads
        # `uname -s` to pick its platform libraries, so cmd and PowerShell are
        # not shells it can run in.
        shell: ${{ matrix.os == 'windows-latest' && 'msys2 {0}' || 'bash' }}

    steps:
      # With deps/aephysics, the physics engine, which build.sh compiles in.
      - uses: actions/checkout@v4
        with:
          submodules: true

      - name: Set up MSYS2 (windows)
        if: runner.os == 'Windows'
        uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          # pkgconf is not optional: build.sh asks pkg-config where GLFW and
          # zlib are, and without it falls back to a bare -lglfw with no
          # include path, which finds nothing. vulkan-headers likewise -- the
          # loader is opened at runtime, but glfw3.h needs the header the
          # moment GLFW_INCLUDE_VULKAN is defined.
          # make and bc are the Aether installer's own prerequisites, not
          # ae3d's; it builds the compiler from source before anything here
          # can run.
          install: >-
            git
            make
            bc
            mingw-w64-ucrt-x86_64-gcc
            mingw-w64-ucrt-x86_64-glfw
            mingw-w64-ucrt-x86_64-zlib
            mingw-w64-ucrt-x86_64-pkgconf
            mingw-w64-ucrt-x86_64-vulkan-headers
            mingw-w64-ucrt-x86_64-ccache

      # The packages' .deb files, kept from the last run on the same runner
      # image and tier. The mirror is not the same speed twice: the same 69 MB
      # came in 25 seconds on one run and in 5 minutes 23 on the next (run
      # 36921859229, 213 kB/s). apt checks each kept file against the index it
      # has just fetched and downloads what changed, so what is installed is
      # what a run without the cache installs.
      - name: Resolve the runner image (linux)
        if: runner.os == 'Linux'
        id: image
        run: echo "version=${ImageOS:-ubuntu}-${ImageVersion:-unknown}" >> "$GITHUB_OUTPUT"

      - name: Restore the packages (linux)
        if: runner.os == 'Linux'
        uses: actions/cache@v4
        with:
          path: /tmp/apt-archives
          key: apt-${{ matrix.tier }}-${{ steps.image.outputs.version }}

      - name: Install dependencies (linux)
        if: runner.os == 'Linux'
        run: |
          # Outside the home directory, which apt's own user cannot enter: it
          # downloads as _apt into partial/, and falls back to downloading as
          # root, with a notice in the log, where it cannot.
          mkdir -p /tmp/apt-archives/partial
          sudo chown _apt:root /tmp/apt-archives/partial
          sudo apt-get update
          # mesa-vulkan-drivers is lavapipe, a software device. Without an ICD
          # the loader is present and reports no device, so the Vulkan half of
          # the suite would skip rather than run.
          # The matrix adds the rest: libgtk-4-dev for the editor (aether-ui's
          # Linux backend is GTK4, and ci.sh builds and drives the editor when
          # it finds a checkout); vulkan-validationlayers, the Khronos layer
          # ci.sh runs the readback suites under, synchronization validation
          # on (#458).
          sudo apt-get install -y -o Dir::Cache::Archives=/tmp/apt-archives \
            libglfw3-dev libvulkan-dev mesa-vulkan-drivers xvfb gdb ccache ${{ matrix.packages }}
          # The cache is saved as this user, and partial/ is _apt's alone.
          sudo chown -R "$(id -u):$(id -g)" /tmp/apt-archives

      # glslang 16.6.0, the one the checked-in SPIR-V is made with (Nic,
      # 2026-10-16): generate_shaders refuses any other version, so the
      # suites' runners, which run its --check and test_gpu's glslang
      # checks, take Khronos' release build rather than the packages'. Its
      # archive and binary are checked by sha256 (scripts/glslang.sh) and
      # kept by version, so a run fetches it once.
      - name: Cache glslang (linux suites)
        if: matrix.tier == 'suites'
        uses: actions/cache@v4
        with:
          path: ~/.cache/ae3d/glslang-16.6.0
          key: glslang-16.6.0-linux-x86_64-release

      - name: Install glslang (linux suites)
        if: matrix.tier == 'suites'
        run: ./scripts/glslang.sh >> "$GITHUB_PATH"

      # The editor's toolkit, so the editor is built, run bounded on both
      # backends, and driven through its widgets here rather than only on
      # the machine the change was written on. It went unrun in CI for want
      # of this checkout, and a crash in the first report that read a field
      # back (a toolkit bug, aether-ui#156) stood at HEAD for weeks.
      - name: Fetch aether-ui (linux)
        if: matrix.tier == 'apps'
        run: |
          git clone https://github.com/aether-lang-dev/aether-ui.git "$RUNNER_TEMP/aether-ui"
          git -C "$RUNNER_TEMP/aether-ui" checkout --quiet "$AETHER_UI_REF"

      # The Vulkan backend opens the loader at run time but still needs the
      # headers to compile, the same way the Linux job gets them from
      # libvulkan-dev. Without them glfw3.h fails on the include it makes when
      # GLFW_INCLUDE_VULKAN is defined, and nothing in the project builds.
      - name: Install dependencies (macos)
        if: runner.os == 'macOS'
        run: brew install glfw vulkan-headers ccache

      # The toolchain is built from source, which is a minute or more of a run.
      # It is cached under the release it was built from (AETHER_REF): the
      # same pin is restored, a bump rebuilds once. The path is
      # resolved in the job's own shell -- ~/.aether, which on the MSYS2 shell is
      # a POSIX home actions/cache (a Node action) cannot read, so cygpath hands
      # it the Windows path for the same directory.
      - name: Resolve the Aether version
        id: aether
        run: |
          dir="$HOME/.aether"
          if command -v cygpath >/dev/null 2>&1; then dir="$(cygpath -w "$dir")"; fi
          echo "dir=$dir" >> "$GITHUB_OUTPUT"

      - name: Cache the Aether toolchain
        uses: actions/cache@v4
        with:
          path: ${{ steps.aether.outputs.dir }}
          key: aether-${{ runner.os }}-${{ env.AETHER_REF }}

      # install.sh is a bash script that changes to its own directory and builds
      # the compiler from the tree around it. Piping it into a shell gave it
      # neither: dash rejected its options on Linux, and on macOS it ran make in
      # this checkout instead, which has no compiler to build.
      #
      # Skipped when the cache already holds a working toolchain, and run anyway
      # if it does not: a cache that restored partially leaves the binaries
      # missing, and building them is how that heals rather than failing the
      # whole run on a "'aetherc' not found".
      - name: Install the Aether toolchain
        run: |
          if [ -x "$HOME/.aether/bin/aetherc" ] || [ -x "$HOME/.aether/bin/aetherc.exe" ]; then
            echo "Aether toolchain restored from cache; skipping the build."
          else
            git clone --depth 1 --branch "$AETHER_REF" https://github.com/aether-lang-dev/aether.git "$RUNNER_TEMP/aether"
            (cd "$RUNNER_TEMP/aether" && ./install.sh)
          fi

      # The objects each compile made, from the last run on this runner
      # (#511). Almost all of a run is compiling the engine into some 150
      # programs, and a program whose imports a change did not touch
      # generates the same C byte for byte: ccache hands its object back at
      # once. Keyed by the commit, restored from the newest of any. By tier,
      # not by job name: a restore key matches by prefix, and "linux" is one
      # of "linux-apps", so the suites' runner restored the examples' objects
      # and missed on 121 of its 296 compiles (run 36921859229). With them,
      # the C aetherc generated for each program, which build.sh gives back
      # while nothing the compiler read for it has changed: aetherc was most
      # of a build (577 s of 823 on macOS, run of 27bbed5).
      - name: Restore the compile cache
        uses: actions/cache@v4
        with:
          path: |
            .ccache
            .aecache
          key: ccache-${{ matrix.tier }}-${{ matrix.name }}-${{ github.sha }}
          restore-keys: |
            ccache-${{ matrix.tier }}-${{ matrix.name }}-
            ccache-${{ matrix.tier }}-

      - name: Run CI
        run: |
          # PATH is set here rather than through GITHUB_PATH. setup-msys2
          # defaults to `path-type: minimal`, so the MSYS2 shell does not
          # inherit the Windows PATH and never sees what GITHUB_PATH adds --
          # install.sh put the toolchain in /home/runneradmin/.aether and every
          # build failed with "'aetherc' not found". Exporting it in the step
          # that needs it is the same shell that installed it, on all three
          # platforms, so no per-OS branch is required.
          export PATH="$HOME/.aether/bin:$PATH"
          export AE3D_CI_TIER="${{ matrix.tier }}"
          export AE3D_CI_SHARD="${{ matrix.shard }}"
          # Whether a program can draw here: lavapipe and llvmpipe on Linux,
          # nothing on the macOS and Windows runners, where every suite that
          # draws says SKIP and is not built (ci.sh's GPU_SUITES).
          export AE3D_CI_GPU="${{ matrix.gpu }}"
          export AE3D_CC_LAUNCHER=ccache CCACHE_DIR="$GITHUB_WORKSPACE/.ccache" CCACHE_MAXSIZE=2G
          export AE3D_AETHERC_CACHE="$GITHUB_WORKSPACE/.aecache"
          ccache -z >/dev/null

          # Windows needs no special casing below. The leak step keys on `leaks`,
          # which is macOS-only, so it self-skips on Linux and Windows alike --
          # AE3D_SKIP_LEAKS would be redundant, and CI is documented never to
          # set it. Only Linux needs a display server.
          if [ "$RUNNER_OS" = "Linux" ]; then
            AETHER_UI_ROOT="$RUNNER_TEMP/aether-ui" xvfb-run -a ./ci.sh
          else
            ./ci.sh
          fi

      - name: How much the compile cache gave back
        if: success() || failure()
        run: CCACHE_DIR="$GITHUB_WORKSPACE/.ccache" ccache -s

      # The determinism trail (#441): the networked horde and aephysics
      # hashed at every tick from a fixed start, by the suite ci.sh has just
      # built and run (tests/test_determinism.ae), by each runner that runs
      # the suites. Written whether or not the run above passed, since what
      # it answers -- does this platform simulate what the others do -- is a
      # question of its own. The determinism job below reads all three and
      # compares them.
      - name: Write the determinism trail
        if: (success() || failure()) && matrix.trail
        run: |
          export PATH="$HOME/.aether/bin:$PATH"
          if [ ! -f build/test_determinism ] && [ ! -f build/test_determinism.exe ]; then
            ./build.sh tests/test_determinism.ae
          fi
          AE3D_DETERMINISM_TRAIL="determinism-${{ matrix.name }}.txt" ./build/test_determinism

      - name: Keep the determinism trail
        if: (success() || failure()) && matrix.trail
        uses: actions/upload-artifact@v4
        with:
          name: determinism-${{ matrix.name }}
          path: determinism-${{ matrix.name }}.txt
          if-no-files-found: error

  # A Mac playing a PC holds the same horde only if every float operation in
  # the tick rounds the same on arm64 as on x86-64 (#441). Each runner above
  # wrote the hash of the horde at every tick and of the physics at every
  # step; this compares them line for line and fails on the first that
  # differs, naming it, so a divergence is found at the tick it starts.
  #
  # After a build that failed, since a trail is written either way; not after
  # one that was cancelled, which wrote none and has nothing to compare --
  # always() ran it there, and every superseded run ended on a red
  # "no trail from linux" that said nothing about the change.
  determinism:
    needs: build
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    name: determinism
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: determinism-*
          merge-multiple: true

      - name: Compare the three platforms' trails
        run: |
          status=0
          for os in linux macos windows; do
            if [ ! -s "determinism-$os.txt" ]; then
              echo "no trail from $os"
              status=1
              continue
            fi
            # Windows' C runtime may write its lines with a carriage return.
            tr -d '\r' < "determinism-$os.txt" > "$os.txt"
          done
          [ "$status" -eq 0 ] || exit 1
          for os in macos windows; do
            if cmp -s linux.txt "$os.txt"; then
              echo "$os (x86-64 Linux against $(case $os in macos) echo 'arm64 macOS';; *) echo 'x86-64 Windows';; esac)): $(wc -l < "$os.txt") lines, the same to the bit"
            else
              echo "$os differs from linux; the first lines that differ:"
              diff linux.txt "$os.txt" | head -12
              status=1
            fi
          done
          echo "the last lines, every platform:"
          tail -2 linux.txt
          exit "$status"
